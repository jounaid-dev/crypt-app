# Gradle needs a heap bigger than the default when it compiles the Kotlin
# build scripts of Flutter plugins (share_plus and others ship build.gradle.kts),
# otherwise the build dies with "Java heap space".
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G

android.useAndroidX=true
